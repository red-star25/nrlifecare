name: Sync product catalogue (disabled)

# DISABLED — the live catalogue is the 2026 PDF import + Sanity CMS.
# Pulling the old Google Sheet overwrote ~1478 products with 322 and zeroed
# out categories like Human Steroid APIs.
#
# Source of truth now:
#   - Sanity Studio edits → cms-pull (or /api/cms-webhook)
#   - Full re-seed from repo → cms-push
#
# Kept on disk so history is clear. Do not re-enable the schedule without
# updating the sheet to the full 2026 catalogue first.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ENABLE to run the legacy Google Sheet sync'
        required: true
        default: ''

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event.inputs.confirm == 'ENABLE' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pull catalogue from Google Sheet
        env:
          CATALOG_CSV_URL: ${{ secrets.CATALOG_CSV_URL }}
        run: |
          if [ -z "$CATALOG_CSV_URL" ]; then
            echo "::error::CATALOG_CSV_URL secret is not set."
            exit 1
          fi
          npm run catalog:sync

      - name: Verify the site still builds
        run: npm run build

      - name: Commit if the catalogue changed
        run: |
          if git diff --quiet -- src/data/products.generated.ts; then
            echo "No catalogue changes."
            exit 0
          fi

          COUNT=$(grep -c '^  { category:' src/data/products.generated.ts)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/products.generated.ts
          git commit -m "Update product catalogue from sheet (${COUNT} products)"
          git push
